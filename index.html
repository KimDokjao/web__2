<!DOCTYPE html>
<html lang="en">
<head>

  <title>Recipe Library</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header>
    <h1>Recipe Library</h1>

  <footer>
    <p>&copy; Recipe Library</p>
  </footer>
